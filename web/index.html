<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Himnario">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Himnario">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Himnario</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // El navegador ofrece instalar la app una sola vez y muy temprano, antes
    // de que cargue Flutter: se guarda ese aviso para lanzarlo desde
    // "Instalar APP" en el menú de la app.
    window.addEventListener('beforeinstallprompt', (aviso) => {
      aviso.preventDefault();
      window.avisoInstalacion = aviso;
    });
    window.addEventListener('appinstalled', () => {
      window.avisoInstalacion = null;
    });
    // "Actualizar": el service worker baja la versión nueva completa y después
    // se recarga. 'error' si no se pudo (sin internet): se queda la que está.
    window.himnarioActualizar = async () => {
      const sw = navigator.serviceWorker?.controller;
      if (sw) {
        const resultado = await new Promise((resolve) => {
          const canal = new MessageChannel();
          canal.port1.onmessage = (evento) => resolve(evento.data);
          sw.postMessage({ tipo: 'actualizar' }, [canal.port2]);
          setTimeout(() => resolve('tiempo agotado'), 120000);
        });
        if (resultado !== 'ok') {
          console.warn('No se pudo bajar la versión nueva', resultado);
          return 'error';
        }
      }
      location.reload();
      return 'ok';
    };
    window.himnarioInstalar = async () => {
      const aviso = window.avisoInstalacion;
      if (!aviso) return 'no-disponible';
      window.avisoInstalacion = null;
      await aviso.prompt();
      return (await aviso.userChoice).outcome;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
